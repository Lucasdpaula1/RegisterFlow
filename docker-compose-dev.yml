version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dev_db
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dev_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
  backend:
    build:
      context: ./backend
      target: development
    container_name: dev_backend
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: dev_frontend
    env_file:
      - .env.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dev_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # painel de gestão
    volumes:
      - rabbitmqdata_dev:/var/lib/rabbitmq
  # worker:
  #   build:
  #     context: ./worker
  #   container_name: dev_worker
  #   env_file:
  #     - ./worker/.env.dev
  #   depends_on:
  #     - rabbitmq
  #   restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: dev_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata_dev:
  redisdata_dev:
  rabbitmqdata_dev: