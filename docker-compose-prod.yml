version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    volumes:
      - redisdata_prod:/data

  backend:
    build:
      context: ./backend
      target: production
    container_name: prod_backend
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: prod_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
  prometheus:
    image: prom/prometheus:latest
    container_name: prod_prometheus
    restart: always
    volumes:
      - .prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
  worker:
    build:
      context: ./worker
    container_name: prod_worker
    env_file:
      - ./worker/.env.prod
    depends_on:
      - rabbitmq
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: prod_rabbitmq
    restart: always
    ports:
      - "15672:15672"
    volumes:
      - rabbitmqdata_dev:/var/lib/rabbitmq
  grafana:
    image: grafana/grafana:latest
    container_name: prod_grafana
    restart: always
    ports:
      - "3001:3000" 
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata_prod:
  redisdata_prod:
  promdata:
  grafanadata: